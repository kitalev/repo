name: Sync .deb from GitHub-Legacy releases

on:
  workflow_dispatch:      # ручной запуск кнопкой во вкладке Actions
  schedule:
    - cron: '0 6 * * *'   # плюс проверка раз в сутки, в 06:00 UTC — можно убрать, если хотите только вручную

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest .deb URLs from GitHub-Legacy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kitalev/GitHub-Legacy/releases/latest)

          # Every .deb in the release: rootful (iphoneos-arm) and rootless (iphoneos-arm64)
          echo "$RESPONSE" \
            | grep '"browser_download_url"' \
            | grep '\.deb"' \
            | cut -d '"' -f 4 > "$RUNNER_TEMP/deb-urls.txt" || true

          if [ ! -s "$RUNNER_TEMP/deb-urls.txt" ]; then
            echo "No .deb asset found in latest release, aborting."
            echo "--- API response (first 40 lines) ---"
            echo "$RESPONSE" | head -n40
            exit 1
          fi
          cat "$RUNNER_TEMP/deb-urls.txt"

      - name: Download and replace .deb
        run: |
          set -euo pipefail
          mkdir -p debs
          rm -f debs/*.deb
          while read -r url; do
            # Asset URLs are percent-encoded (+ becomes %2B); keep plain file names
            # without '+', so the Filename paths in Packages resolve on GitHub Pages.
            name=$(basename "$url" | python3 -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()).replace("+", "plus"))')
            curl -sfL -o "debs/$name" "$url"
          done < "$RUNNER_TEMP/deb-urls.txt"
          ls -la debs

      - name: Regenerate Packages index
        run: bash generate.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debs Packages Packages.gz Packages.bz2 Release packages.json
          if git diff --cached --quiet; then
            echo "Nothing changed - already up to date."
          else
            git commit -m "Sync latest .deb from GitHub-Legacy"
            git push
          fi
